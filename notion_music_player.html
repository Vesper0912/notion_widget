    padding: max(7vmin, env(safe-area-inset-top)) max(7vmin, env(safe-area-inset-right)) max(7vmin, env(safe-area-inset-bottom)) max(7vmin, env(safe-area-inset-left));
  }

  /* 背景压暗层，突出播放器 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(10, 15, 26, 0.18), rgba(10, 15, 26, 0.42));
    pointer-events: none;
  }

  /* ============ 播放器主体：透明圆角磨砂悬浮卡片 ============ */
  .player {
    position: relative;
    z-index: 1;
    /* 与 16:9 背景图等比例放缩：以视口宽度为基准，窗口固定、内容全部常显不可滑动 */
    width: clamp(340px, 56vw, 620px);
    overflow: hidden;
    border-radius: 26px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(20px) saturate(1.35);
    -webkit-backdrop-filter: blur(20px) saturate(1.35);
    padding: 26px 26px 20px;
    animation: float-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes float-in {
    from { opacity: 0; transform: translateY(26px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 顶部标题栏：替代频道 chips */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
  }
  .header .pl-name {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 17px;
    letter-spacing: 0.05em;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
  }
  .header .pl-count {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* 中部：唱片 + 歌曲信息 */
  .main { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }

  .disc-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    flex: 0 0 auto;
  }
  .disc {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #1c1c22 0 18%, transparent 18.5%),
      repeating-radial-gradient(circle at 50% 50%, #22222a 0 2px, #17171d 2px 4px);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45), inset 0 0 0 3px rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: spin 9s linear infinite;
    animation-play-state: paused;
  }
  .disc img {
    width: 44%;
    height: 44%;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 4px #0c0c10;
  }
  .disc::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px #0c0c10;
  }
  .playing .disc { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta { min-width: 0; flex: 1; }
  .meta .title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .meta .artist {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 进度条 */
  .progress-area { margin-bottom: 16px; }
  .times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }
  .bar {
    position: relative;
    height: 22px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .bar::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.22);
  }
  .bar .fill {
    position: absolute;
    left: 0;
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(90deg, #f2c66d, var(--accent));
    width: 0%;
  }
  .bar .knob {
    position: absolute;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    transform: translateX(-50%);
    left: 0%;
    transition: transform 0.15s ease;
  }
  .bar:hover .knob { transform: translateX(-50%) scale(1.2); }

  /* 底部控制按钮 */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .btn {
    width: 46px;
    height: 46px;
    min-width: 44px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.14); }
  .btn:active { transform: scale(0.92); }
  .btn svg { width: 21px; height: 21px; fill: currentColor; }

  .btn.play {
    width: 58px;
    height: 58px;
    background: rgba(255, 255, 255, 0.92);
    color: #1c1c22;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  .btn.play:hover { background: #fff; }
  .btn.play svg { width: 26px; height: 26px; }

  .btn.loop.on { color: var(--accent); }

  /* 音量 */
  .volume { display: flex; align-items: center; gap: 8px; }
  .volume input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 78px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.25);
    outline: none;
    cursor: pointer;
  }
  .volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  }
  .volume input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border: none;
    border-radius: 50%;
    background: #fff;
  }

  /* 列表展开 */
  .playlist {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .playlist.open { max-height: 240px; }
  .playlist ul { list-style: none; padding-top: 12px; }
  .playlist li {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 8px 10px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .playlist li:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }
  .playlist li.current { color: var(--accent); font-weight: 600; }
  .playlist li .idx { width: 20px; text-align: right; font-size: 11px; opacity: 0.7; flex: 0 0 auto; }
  .playlist li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .footer-note {
    margin-top: 14px;
    text-align: center;
    font-size: 11px;
    color: rgba(253, 250, 245, 0.5);
    letter-spacing: 0.12em;
  }

  /* ===== 手机端（Notion 嵌入以手机为主）：占满内容区，按钮一排装下 ===== */
  @media (max-width: 640px) {
    .player { width: 100%; padding: 20px 16px 14px; }
    .main { gap: 14px; }
    .disc-wrap { width: 76px; height: 76px; }
    .meta .title { font-size: 16px; }
    .controls { gap: 4px; }
    .btn { width: 42px; height: 42px; min-width: 40px; }
    .btn.play { width: 52px; height: 52px; }
    /* 窄屏隐藏音量条，保留静音键，防止控制区横向溢出 */
    .volume input[type="range"] { display: none; }
    .volume .btn { width: 36px; height: 36px; min-width: 36px; }
  }

  /* ===== 矮视口（Notion 嵌入高度受限）：整体收紧，底部小字无需滚动即可见 ===== */
  @media (max-height: 620px) {
    .player { padding: 16px 22px 12px; }
    .header { margin-bottom: 10px; }
    .main { margin-bottom: 12px; }
    .disc-wrap { width: 64px; height: 64px; }
    .progress-area { margin-bottom: 10px; }
    .footer-note { margin-top: 8px; }
  }
</style>
</head>
<body>

<div class="player" id="player">
  <!-- 歌单标题 -->
  <div class="header">
    <span class="pl-name" id="plName">Playlist</span>
    <span class="pl-count" id="plCount"></span>
  </div>

  <!-- 唱片 + 信息 -->
  <div class="main">
    <div class="disc-wrap">
      <div class="disc" id="disc">
        <img id="cover" alt="" referrerpolicy="no-referrer">
      </div>
    </div>
    <div class="meta">
      <div class="title" id="title">—</div>
      <div class="artist" id="artist">—</div>
    </div>
  </div>

  <!-- 进度 -->
  <div class="progress-area">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="bar" id="bar">
      <div class="fill" id="fill"></div>
      <div class="knob" id="knob"></div>
    </div>
  </div>

  <!-- 控制 -->
  <div class="controls">
    <button class="btn" id="prevBtn" title="上一首" aria-label="上一首">
      <svg viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM19 5v14L9.6 12z"/></svg>
    </button>
    <button class="btn play" id="playBtn" title="播放 / 暂停" aria-label="播放或暂停">
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="btn" id="nextBtn" title="下一首" aria-label="下一首">
      <svg viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM5 5v14l9.4-7z"/></svg>
    </button>
    <button class="btn loop" id="loopBtn" title="循环模式" aria-label="循环模式">
      <svg viewBox="0 0 24 24"><path d="M12 4V1L7 6l5 5V7c3.3 0 6 2.7 6 6 0 1-.3 2-.7 2.8l1.5 1.5A8 8 0 0 0 12 4zm0 14c-3.3 0-6-2.7-6-6 0-1 .3-2 .7-2.8L5.2 7.7A8 8 0 0 0 12 20v3l5-5-5-5v5z"/></svg>
    </button>
    <button class="btn" id="listBtn" title="播放列表" aria-label="播放列表">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4zm13 0v6l5-3z"/></svg>
    </button>
    <div class="volume">
      <button class="btn" id="muteBtn" title="静音" aria-label="静音" style="width:40px;height:40px;min-width:40px">
        <svg id="iconVol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg id="iconMute" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7z"/></svg>
      </button>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="音量">
    </div>
  </div>

  <!-- 播放列表 -->
  <div class="playlist" id="playlist"><ul id="list"></ul></div>

  <div class="footer-note">Love to keep us warm · NetEase Cloud Music</div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
/* ================================================================
 * 配置区：歌单。id 为网易云音乐歌曲 ID。
 * 歌曲封面会自动从公开接口获取，获取失败时使用备用封面。
 * ================================================================ */
const PLAYLISTS = [
  {
    name: "Laufey",
    songs: [
      { id: 2047103213, name: "From The Start", artist: "Laufey" },
      { id: 2717750176, name: "Lover Girl", artist: "Laufey" },
      { id: 1912034355, name: "Valentine", artist: "Laufey" },
      { id: 1822031017, name: "I Wish You Love", artist: "Laufey" },
      { id: 1963941809, name: "Falling Behind", artist: "Laufey" },
      { id: 2147794973, name: "Dreamer", artist: "Laufey" }
    ]
  }
];

/* ================================================================ */

const $ = (id) => document.getElementById(id);
const audio = $("audio");
const state = { pl: 0, idx: 0, loop: 0, seeking: false }; // loop: 0 列表循环 1 单曲 2 随机

const coverFallback = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#e8b04b"/><circle cx="50" cy="50" r="30" fill="#fdfaf5"/><text x="50" y="57" font-size="15" text-anchor="middle" fill="#2b1f08" font-family="serif" font-style="italic">Music</text></svg>'
);

function currentList() { return PLAYLISTS[state.pl].songs; }

function streamUrl(id) { return "https://music.163.com/song/media/outer/url?id=" + id + ".mp3"; }

async function fetchMeta(song) {
  try {
    const r = await fetch("https://api.injahow.cn/meting/?type=song&id=" + song.id);
    const d = await r.json();
    if (d && d[0] && d[0].pic) song.cover = d[0].pic; // 只取封面，歌名以手动配置为准
  } catch (e) { /* 接口不可用时使用备用封面 */ }
}

async function load(i, autoplay = true) {
  const list = currentList();
  if (!list.length) return;
  state.idx = (i + list.length) % list.length;
  const song = list[state.idx];
  $("title").textContent = "加载中…";
  $("artist").textContent = song.artist || "";
  await fetchMeta(song);
  $("title").textContent = song.name || "未知歌曲";
  $("artist").textContent = song.artist || "未知艺术家";
  $("cover").src = song.cover || coverFallback;
  audio.src = streamUrl(song.id);
  renderList();
  if (autoplay) audio.play().catch(() => setPlaying(false));
}

function setPlaying(on) {
  $("player").classList.toggle("playing", on);
  $("iconPlay").style.display = on ? "none" : "";
  $("iconPause").style.display = on ? "" : "none";
}

function next(auto = false) {
  const list = currentList();
  if (!list.length) return;
  if (state.loop === 2 && list.length > 1) {
    let i;
    do { i = Math.floor(Math.random() * list.length); } while (i === state.idx);
    load(i);
  } else {
    load((state.idx + 1) % list.length);
  }
}

function prev() { load((state.idx - 1 + currentList().length) % currentList().length); }

function fmt(s) {
  if (!isFinite(s)) return "0:00";
  s = Math.floor(s);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

const PLAYER_TITLE = "music player";

function renderHeader() {
  const p = PLAYLISTS[state.pl];
  $("plName").textContent = PLAYER_TITLE;
  $("plCount").textContent = p.songs.length + " tracks";
}

function renderList() {
  const ul = $("list");
  ul.innerHTML = "";
  currentList().forEach((s, i) => {
    const li = document.createElement("li");
    if (i === state.idx) li.className = "current";
    li.innerHTML = '<span class="idx">' + (i + 1) + '</span><span class="name">' +
      (s.name || "加载中…") + " — " + (s.artist || "") + "</span>";
    li.onclick = () => load(i);
    ul.appendChild(li);
  });
}

/* 事件 */
$("playBtn").onclick = () => { audio.paused ? audio.play() : audio.pause(); };
$("nextBtn").onclick = () => next();
$("prevBtn").onclick = prev;
audio.addEventListener("play", () => setPlaying(true));
audio.addEventListener("pause", () => setPlaying(false));
audio.addEventListener("ended", () => { state.loop === 1 ? load(state.idx) : next(true); });
audio.addEventListener("error", () => {
  $("title").textContent = "歌曲暂不可用，试试下一首";
});

$("loopBtn").onclick = () => {
  state.loop = (state.loop + 1) % 3;
  const modes = ["列表循环", "单曲循环", "随机播放"];
  $("loopBtn").classList.toggle("on", state.loop === 1);
  $("loopBtn").title = modes[state.loop];
};

$("listBtn").onclick = () => $("playlist").classList.toggle("open");

$("vol").oninput = (e) => { audio.volume = e.target.value / 100; audio.muted = false; syncMute(); };
$("muteBtn").onclick = () => { audio.muted = !audio.muted; syncMute(); };
function syncMute() {
  const m = audio.muted || audio.volume === 0;
  $("iconVol").style.display = m ? "none" : "";
  $("iconMute").style.display = m ? "" : "none";
}
audio.volume = 0.8;

/* 进度条（支持拖拽，桌面 + 触屏） */
function seekTo(clientX) {
  const r = $("bar").getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  if (isFinite(audio.duration)) audio.currentTime = p * audio.duration;
}
audio.addEventListener("timeupdate", () => {
  if (state.seeking) return;
  const p = (audio.currentTime / audio.duration) * 100 || 0;
  $("fill").style.width = p + "%";
  $("knob").style.left = p + "%";
  $("cur").textContent = fmt(audio.currentTime);
});
audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); });
audio.addEventListener("loadedmetadata", () => { $("cur").textContent = "0:00"; });

let dragging = false;
["pointerdown"].forEach(ev => $("bar").addEventListener(ev, e => { dragging = true; seekTo(e.clientX); }));
window.addEventListener("pointermove", e => { if (dragging) seekTo(e.clientX); });
window.addEventListener("pointerup", () => { dragging = false; });

/* 启动 */
renderHeader();
renderList();
load(0, false).then(() => { audio.pause(); setPlaying(false); });
</script>
</body>
</html>
